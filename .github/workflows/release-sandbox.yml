name: Release (sandbox)

on:
  push:
    branches:
      - deepseek

permissions:
  contents: write

jobs:
  build:
    name: x86_64-unknown-linux-gnu (sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the post-build commit can rebase+push back to
          # `deepseek` (same rationale as the release.yml nix bump job).
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-gnu

      # libkrun must be built from source: upstream releases ship no prebuilt
      # .so assets. The runner links -lkrun and dirge's build.rs probes for
      # libkrun.so to decide whether to emit `krun_linked` (real runner vs
      # stub). Build deps: make, gcc (for init.c), patchelf (for install),
      # and static libc (init links -static) — all available on ubuntu-latest.
      # libkrunfw is NOT needed at build time: libkrun dlopens it at runtime.
      - name: Build libkrun from source
        run: |
          sudo apt-get update && sudo apt-get install -y make gcc patchelf libclang-dev
          git clone --depth 1 --branch v1.19.4 \
            https://github.com/libkrun/libkrun /tmp/libkrun
          cd /tmp/libkrun
          # libkrun's `install` target does not depend on `all`: build the
          # library first, then install it.
          make -j"$(nproc)" PREFIX=/tmp/krun
          make install PREFIX=/tmp/krun
          echo "LIBKRUN_LIB_DIR=/tmp/krun/lib64" >> "$GITHUB_ENV"

      - name: Build dirge (sandbox-microvm)
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu \
            --features sandbox-microvm

      - name: Package
        run: |
          archive=dirge-x86_64-unknown-linux-gnu-sandbox.tar.gz
          stag=target/x86_64-unknown-linux-gnu/release
          tar czf "$archive" -C "$stag" dirge dirge-microvm-runner
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dirge-x86_64-unknown-linux-gnu-sandbox.tar.gz*
          file_glob: true
          tag: ds-sandbox
          overwrite: true

      # Rolling tag: the `ds-sandbox` asset is overwritten on every push to
      # `deepseek`, so the fixed-output hash in nix/bin-sandbox.nix must
      # track the tarball just uploaded. The artifact was built in this job,
      # so compute the SRI hash locally instead of `nix store prefetch-file`.
      - name: Update nix/bin-sandbox.nix
        run: |
          set -euo pipefail
          archive=dirge-x86_64-unknown-linux-gnu-sandbox.tar.gz
          HASH="sha256-$(openssl dgst -sha256 -binary "$archive" | base64 -w0)"
          HASH="$HASH" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("nix/bin-sandbox.nix")
          text = path.read_text()
          text = re.sub(
              r'hash = "sha256-[A-Za-z0-9+/=]+";',
              f'hash = "{os.environ["HASH"]}";',
              text,
              count=1,
          )
          path.write_text(text)
          PY

      # Commit the bump back to `deepseek`. A GITHUB_TOKEN push doesn't
      # re-trigger workflows, so this can't loop the build. `deepseek` is
      # unprotected; if branch protection is added later this needs a PAT.
      - name: Commit nix/bin-sandbox.nix bump
        run: |
          set -euo pipefail
          if git diff --quiet -- nix/bin-sandbox.nix; then
            echo "nix/bin-sandbox.nix already current — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/bin-sandbox.nix
          git commit -m "Bump Nix dirge-bin-sandbox hash to ${GITHUB_SHA::8}"
          # The workflow runs on every push to `deepseek`; rebase on any
          # movement since checkout so the push fast-forwards.
          git pull --rebase origin deepseek
          git push origin HEAD:deepseek